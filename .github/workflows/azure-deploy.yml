name: Deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    env:
      AZURE_WEBAPP_NAME: prt-backend-g9abh2fjdngzcpdc  # Your actual Azure app name
      PYTHON_VERSION: '3.11'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create deployment package
        run: |
          cd backend
          # Create zip with all files, excluding unnecessary ones
          zip -r ../deploy.zip . \
            -x "venv/*" \
            -x "__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x ".env" \
            -x "backend.log" \
            -x "*.log" \
            -x "uploads/*"
          cd ..
          echo "Deployment package created: deploy.zip"
          unzip -l deploy.zip | head -20

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip

      - name: Check deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 45
          echo "Testing health endpoint..."
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.canadacentral-01.azurewebsites.net/health || echo "Health check failed, but continuing..."
          echo "Deployment complete!"
