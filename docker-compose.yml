version: '3.8'

services:
  # MongoDB Atlas is used instead of local MongoDB
  # mongodb:
  #   image: mongo:7.0
  #   container_name: driver_app_mongodb
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_DATABASE: driver_app
  #   volumes:
  #     - mongodb_data:/data/db
  #   networks:
  #     - driver_app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driver_app_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb+srv://thinktreesystemsllp_db_user:hAbdFYj9G8NxUpze@pr-driver-app.0wvhuk1.mongodb.net/?appName=pr-driver-app
      - DATABASE_NAME=driver_app
    volumes:
      - ./backend:/app
    networks:
      - driver_app_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driver_app_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - driver_app_network
    command: npm run dev -- --host

# volumes:
#   mongodb_data:  # Not needed when using MongoDB Atlas

networks:
  driver_app_network:
    driver: bridge

